<ion-header>
  <ion-toolbar>
    <ion-title>PriceManager</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="box">
    <h2>Conexión con el API</h2>

    @if (loading()) {
      <ion-spinner name="dots"></ion-spinner>
      <p>Probando conexión...</p>
    }

    @if (state() === 'ok' && info(); as i) {
      <p class="ok">✅ API conectado</p>
      <p><strong>{{ i.app }}</strong> · versión {{ i.version }}</p>
    }

    @if (state() === 'error') {
      <p class="err">❌ {{ errorMsg() }}</p>
    }

    <ion-button (click)="checkApi()" [disabled]="loading()">Probar de nuevo</ion-button>
  </div>
</ion-content>
